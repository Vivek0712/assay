<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 892" width="1040" height="892" role="img" aria-labelledby="t d">
<title id="t">Assay architecture</title>
<desc id="d">Discovery from builder.aws.com feeds and article API, hourly ingest into S3, eight deterministic tools feeding four Strands judges on Bedrock AgentCore that score fifteen dimensions, caps and a weighted sum in Python, scores stored in DynamoDB and served through a leaderboard page, review portal, Atom feed, MCP server and Chrome extension.</desc>

<style>
  :root { color-scheme: light dark; }
  .bg    { fill:#fbfbfa; }
  .band  { fill:#f2f1ec; stroke:#e3e2dc; }
  .card  { fill:#ffffff; stroke:#d8d7d0; }
  .accent{ fill:#fff8e8; stroke:#e0c274; }
  .agent { fill:#eef6f2; stroke:#9fc9b6; }
  .t     { fill:#16150f; font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif; }
  .muted { fill:#6b6a63; }
  .band-label { fill:#8d8c84; letter-spacing:.14em; }
  .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .arrow { stroke:#a9a89f; fill:none; stroke-width:1.6; }
  .arrowhead { fill:#a9a89f; }
  .rule  { stroke:#e3e2dc; }
  .num   { fill:#8a6a1f; }
  @media (prefers-color-scheme: dark) {
    .bg    { fill:#14140f; }
    .band  { fill:#1b1a15; stroke:#2c2b24; }
    .card  { fill:#201f19; stroke:#35342c; }
    .accent{ fill:#2a2416; stroke:#7d6528; }
    .agent { fill:#17241e; stroke:#3d6553; }
    .t     { fill:#ecebe4; }
    .muted { fill:#96958c; }
    .band-label { fill:#7c7b73; }
    .arrow { stroke:#5c5b53; }
    .arrowhead { fill:#5c5b53; }
    .rule  { stroke:#2c2b24; }
    .num   { fill:#e3b34d; }
  }
</style>

<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" class="arrowhead"/>
  </marker>
</defs>

<rect class="bg" width="1040" height="892"/>

<!-- ============================ header ============================ -->
<text class="t" x="40" y="46" font-size="21" font-weight="600" letter-spacing="-.01em">Assay — read-quality scoring for AWS Builder Center</text>
<text class="t muted" x="40" y="68" font-size="12.5">Measure first, judge second, compute the score in Python. Likes, views and comments are excluded by design.</text>

<!-- ============================ 1. DISCOVERY ============================ -->
<rect class="band" x="40" y="92" width="960" height="96" rx="10"/>
<text class="t band-label" x="56" y="112" font-size="9.5" font-weight="600">1 · DISCOVERY — builder.aws.com, public, no auth</text>

<rect class="card" x="56" y="122" width="228" height="50" rx="7"/>
<text class="t mono" x="70" y="142" font-size="11.5">/rss</text>
<text class="t muted" x="70" y="159" font-size="10.5">Atom · 30 newest · hourly delta</text>

<rect class="card" x="300" y="122" width="248" height="50" rx="7"/>
<text class="t mono" x="314" y="142" font-size="11.5">/sitemaps/articles/YYYY-M.xml</text>
<text class="t muted" x="314" y="159" font-size="10.5">monthly files · full backfill to 2022</text>

<rect class="accent" x="564" y="122" width="420" height="50" rx="7"/>
<text class="t mono" x="578" y="142" font-size="11.5">GET api.builder.aws.com/cs/v2/articles?articleId=…</text>
<text class="t muted" x="578" y="159" font-size="10.5">header <tspan class="mono">builder-session-token: dummy</tspan> — raw markdown + author + tags</text>

<path class="arrow" d="M520 188 L520 214" marker-end="url(#ah)"/>

<!-- ============================ 2. INGEST ============================ -->
<rect class="band" x="40" y="216" width="960" height="88" rx="10"/>
<text class="t band-label" x="56" y="236" font-size="9.5" font-weight="600">2 · INGEST</text>

<rect class="card" x="56" y="246" width="212" height="44" rx="7"/>
<text class="t" x="70" y="266" font-size="12" font-weight="500">EventBridge</text>
<text class="t muted" x="70" y="281" font-size="10.5">rate(1 hour)</text>

<rect class="card" x="290" y="246" width="212" height="44" rx="7"/>
<text class="t" x="304" y="266" font-size="12" font-weight="500">Ingest Lambda</text>
<text class="t muted" x="304" y="281" font-size="10.5">diff vs already scored</text>

<rect class="card" x="524" y="246" width="212" height="44" rx="7"/>
<text class="t" x="538" y="266" font-size="12" font-weight="500">S3 — raw markdown</text>
<text class="t muted" x="538" y="281" font-size="10.5">90-day lifecycle</text>

<rect class="card" x="758" y="246" width="226" height="44" rx="7"/>
<text class="t" x="772" y="266" font-size="12" font-weight="500">Score Lambda</text>
<text class="t muted" x="772" y="281" font-size="10.5">15 latest · rolling 3-day window</text>

<path class="arrow" d="M268 268 L286 268" marker-end="url(#ah)"/>
<path class="arrow" d="M502 268 L520 268" marker-end="url(#ah)"/>
<path class="arrow" d="M736 268 L754 268" marker-end="url(#ah)"/>

<path class="arrow" d="M520 304 L520 330" marker-end="url(#ah)"/>

<!-- ============================ 3. SCORING ============================ -->
<rect class="band" x="40" y="332" width="960" height="372" rx="10"/>
<text class="t band-label" x="56" y="352" font-size="9.5" font-weight="600">3 · SCORING — deterministic measurement, then judgement</text>

<!-- 3a tool belt -->
<rect class="card" x="56" y="362" width="404" height="326" rx="8"/>
<text class="t" x="72" y="384" font-size="12.5" font-weight="600">Deterministic tool belt</text>
<text class="t muted" x="72" y="400" font-size="10.5">exact · model-free · runs first</text>

<rect class="accent" x="72" y="410" width="372" height="34" rx="6"/>
<text class="t mono" x="84" y="425" font-size="10.5" font-weight="600">check_aws_api_names</text>
<text class="t muted" x="84" y="438" font-size="9.5">every API checked against botocore's 426 service definitions</text>

<rect class="card" x="72" y="452" width="181" height="30" rx="6"/>
<text class="t mono" x="82" y="465" font-size="10">aws_footprint</text>
<text class="t muted" x="82" y="476" font-size="9">operated vs merely named</text>

<rect class="card" x="263" y="452" width="181" height="30" rx="6"/>
<text class="t mono" x="273" y="465" font-size="10">validate_code</text>
<text class="t muted" x="273" y="476" font-size="9">ast · bash -n · yaml · node</text>

<rect class="card" x="72" y="490" width="181" height="30" rx="6"/>
<text class="t mono" x="82" y="503" font-size="10">verify_links</text>
<text class="t muted" x="82" y="514" font-size="9">resolve + classify sources</text>

<rect class="card" x="263" y="490" width="181" height="30" rx="6"/>
<text class="t mono" x="273" y="503" font-size="10">structure_stats</text>
<text class="t muted" x="273" y="514" font-size="9">transcripts · headings · placeholders</text>

<rect class="card" x="72" y="528" width="181" height="30" rx="6"/>
<text class="t mono" x="82" y="541" font-size="10">find_artifacts</text>
<text class="t muted" x="82" y="552" font-size="9">repos · packages · demos</text>

<rect class="card" x="263" y="528" width="181" height="30" rx="6"/>
<text class="t mono" x="273" y="541" font-size="10">cross_post_check</text>
<text class="t muted" x="273" y="552" font-size="9">MinHash near-duplicates</text>

<rect class="card" x="72" y="566" width="372" height="30" rx="6"/>
<text class="t mono" x="82" y="579" font-size="10">engagement_ratio</text>
<text class="t muted" x="82" y="590" font-size="9">wired one way: flags implausible likes on a thin post, never rewards them</text>

<text class="t muted" x="72" y="622" font-size="10">Output: the MEASURED SIGNALS block. Judges may interpret it,</text>
<text class="t muted" x="72" y="636" font-size="10">but may never contradict it.</text>

<path class="arrow" d="M460 512 L494 512" marker-end="url(#ah)"/>

<!-- 3b judge fleet -->
<rect class="agent" x="498" y="362" width="486" height="326" rx="8"/>
<text class="t" x="514" y="384" font-size="12.5" font-weight="600">Strands judges — Bedrock AgentCore Runtime</text>
<text class="t muted" x="514" y="400" font-size="10.5">a fresh agent per invocation: no shared conversation, no cross-contamination</text>

<rect class="card" x="514" y="410" width="454" height="32" rx="6"/>
<text class="t" x="526" y="424" font-size="10.5" font-weight="600">TRIAGE</text>
<text class="t muted" x="580" y="424" font-size="10">cheap gate · nova-2-lite · classifies content type</text>
<text class="t muted" x="526" y="436" font-size="9">an announcement costs one cheap call, never four expensive ones</text>

<path class="arrow" d="M741 442 L741 454" marker-end="url(#ah)"/>

<rect class="card" x="514" y="456" width="454" height="28" rx="6"/>
<text class="t" x="526" y="474" font-size="10" font-weight="600">CONTENT</text>
<text class="t num" x="596" y="474" font-size="10" font-weight="600">35</text>
<text class="t muted" x="620" y="474" font-size="9">substance · depth · insight · accuracy · scope</text>

<rect class="card" x="514" y="490" width="454" height="28" rx="6"/>
<text class="t" x="526" y="508" font-size="10" font-weight="600">AWS</text>
<text class="t num" x="596" y="508" font-size="10" font-weight="600">28</text>
<text class="t muted" x="620" y="508" font-size="9">service depth · architecture · well-architected · currency · cost</text>

<rect class="card" x="514" y="524" width="454" height="28" rx="6"/>
<text class="t" x="526" y="542" font-size="10" font-weight="600">EVIDENCE</text>
<text class="t num" x="596" y="542" font-size="10" font-weight="600">22</text>
<text class="t muted" x="620" y="542" font-size="9">evidence · sources · code quality</text>

<rect class="card" x="514" y="558" width="454" height="28" rx="6"/>
<text class="t" x="526" y="576" font-size="10" font-weight="600">READER</text>
<text class="t num" x="596" y="576" font-size="10" font-weight="600">15</text>
<text class="t muted" x="620" y="576" font-size="9">clarity · actionability</text>

<text class="t muted" x="514" y="600" font-size="9.5">15 dimensions in 4 concurrent calls · nova-pro · each sampled 3 times, per-dimension median</text>

<path class="arrow" d="M741 606 L741 616" marker-end="url(#ah)"/>

<rect class="accent" x="514" y="618" width="454" height="30" rx="6"/>
<text class="t" x="526" y="632" font-size="10.5" font-weight="600">CAPS</text>
<text class="t muted" x="566" y="632" font-size="9.5">measurement overrides opinion — services named but never operated,</text>
<text class="t muted" x="566" y="643" font-size="9.5">AWS depth ≤ 49; an API that does not exist, code ≤ 29 and accuracy ≤ 35</text>

<path class="arrow" d="M741 648 L741 656" marker-end="url(#ah)"/>

<rect class="card" x="514" y="656" width="454" height="26" rx="6"/>
<text class="t" x="526" y="667" font-size="9.5"><tspan font-weight="600">RQS</tspan> = weighted sum in Python  +  author credibility (Hero +8 · Amazonian +6 · CB +3)</text>
<text class="t muted" x="526" y="677" font-size="8.5">bonus applied here, never inside a judge — judges never see who wrote it</text>

<path class="arrow" d="M520 704 L520 730" marker-end="url(#ah)"/>

<!-- ============================ 4. STORE ============================ -->
<rect class="band" x="40" y="732" width="960" height="52" rx="10"/>
<text class="t band-label" x="56" y="752" font-size="9.5" font-weight="600">4 · STORE</text>
<text class="t" x="150" y="754" font-size="11.5" font-weight="500">DynamoDB</text>
<text class="t muted" x="222" y="754" font-size="10.5">scores + GSI by-verdict-rqs</text>
<text class="t" x="470" y="754" font-size="11.5" font-weight="500">DynamoDB</text>
<text class="t muted" x="542" y="754" font-size="10.5">reader preferences</text>
<text class="t muted" x="742" y="754" font-size="10.5">RQS 0–100 · READ ≥ 70 · SKIM ≥ 40 · SKIP</text>
<line class="rule" x1="56" y1="764" x2="984" y2="764"/>
<text class="t muted" x="56" y="778" font-size="10">Attribution policy applied on read: READ and SKIM are named and linked; SKIP publishes its score and reasons but never the author.</text>

<path class="arrow" d="M520 784 L520 808" marker-end="url(#ah)"/>

<!-- ============================ 5. SERVE ============================ -->
<rect class="band" x="40" y="810" width="960" height="68" rx="10"/>
<text class="t band-label" x="56" y="830" font-size="9.5" font-weight="600">5 · SERVE — one preference filter, five surfaces</text>

<rect class="card" x="56" y="838" width="176" height="32" rx="7"/>
<text class="t" x="68" y="852" font-size="11" font-weight="500">Leaderboard page</text>
<text class="t muted" x="68" y="864" font-size="9.5">CloudFront + S3</text>

<rect class="accent" x="244" y="838" width="176" height="32" rx="7"/>
<text class="t" x="256" y="852" font-size="11" font-weight="500">Review portal</text>
<text class="t muted" x="256" y="864" font-size="9.5">ranked fixes, priced in points</text>

<rect class="card" x="432" y="838" width="176" height="32" rx="7"/>
<text class="t" x="444" y="852" font-size="11" font-weight="500">Filtered Atom feed</text>
<text class="t muted" x="444" y="864" font-size="9.5">/feed.xml · topic + RQS</text>

<rect class="accent" x="620" y="838" width="176" height="32" rx="7"/>
<text class="t" x="632" y="852" font-size="11" font-weight="500">MCP server</text>
<text class="t muted" x="632" y="864" font-size="9.5">AgentCore · 9 tools · any client</text>

<rect class="card" x="808" y="838" width="176" height="32" rx="7"/>
<text class="t" x="820" y="852" font-size="11" font-weight="500">Chrome extension</text>
<text class="t muted" x="820" y="864" font-size="9.5">badges, site untouched</text>

</svg>
