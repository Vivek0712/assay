<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 128" width="460" height="128" role="img" aria-labelledby="lt ld">
<title id="lt">Assay</title>
<desc id="ld">The Assay wordmark beside a grid mark in which most cells are empty and three carry a gradient, standing for the small share of articles that show real evidence.</desc>

<defs>
  <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8B5CF6"/>
    <stop offset="1" stop-color="#F03CE8"/>
  </linearGradient>
  <linearGradient id="lg2" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#FB4E6D"/>
    <stop offset="1" stop-color="#E838C8"/>
  </linearGradient>
  <clipPath id="lround"><rect x="8" y="8" width="112" height="112" rx="26"/></clipPath>
</defs>

<!-- mark -->
<g clip-path="url(#lround)">
  <rect x="8" y="8" width="112" height="112" fill="#161D26"/>
  <g stroke="#2A323D" stroke-width="1.4" fill="none">
    <path d="M36 8V120M64 8V120M92 8V120M8 36H120M8 64H120M8 92H120"/>
  </g>
  <rect x="64" y="8"  width="56" height="28" fill="url(#lg1)"/>
  <rect x="36" y="36" width="28" height="28" fill="url(#lg1)" opacity=".92"/>
  <rect x="8"  y="64" width="56" height="56" fill="url(#lg2)"/>
</g>

<!-- wordmark -->
<g font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,system-ui,sans-serif">
  <text x="146" y="78" font-size="60" font-weight="700" letter-spacing="-.035em"
        fill="#161D26">Assay</text>
  <text x="150" y="102" font-size="14.5" letter-spacing=".05em" fill="#5D6874">
    MEASURED, NOT UPVOTED
  </text>
</g>
</svg>
