# Hand-labelled golden set.
#
# Labelled by inspecting each article's actual content and measured signals, not
# by looking at what the fleet produced. The question asked of each one was the
# only question this system exists to answer: would a working AWS engineer get
# anything out of opening this?
#
#   READ  worth the click - shows work that was actually done, or teaches
#         something the documentation does not
#   SKIM  has a real point but it is thin, abstract, or reachable from the
#         first paragraph
#   SKIP  nothing here for a practitioner - restates docs, describes a project
#         without showing it, or is a personal announcement
#
# Author names are omitted deliberately; these are labels about artefacts.

labels:
  - article_id: 3FtOI9H152rOXVRvdRXJdztqC3G
    title: "Best Practices for Extending Striped LVM Storage in SAP HANA on AWS"
    verdict: READ
    note: >-
      Nine pasted root-prompt transcripts from a real EC2 instance, with actual
      pvs/vgs/lvs output and a genuine striped-volume gotcha. The strongest
      execution evidence in the sample.

